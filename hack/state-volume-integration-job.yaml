apiVersion: batch/v1
kind: Job
metadata:
  generateName: beta9-state-volume-integration-
  namespace: beta9
  labels:
    app.kubernetes.io/name: beta9
    app.kubernetes.io/component: state-volume-integration
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beta9
        app.kubernetes.io/component: state-volume-integration
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: legacy-benchmark
        image: registry.localhost:5000/beta9-state-volume-legacy-benchmark:state-volume-generated
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          hostname > /report/legacy-pod-hostname
          /usr/local/bin/state-volume-legacy-benchmark \
            -test.run='^$' \
            -test.bench='^BenchmarkDurableDiskWorkspace(Snapshot|Restore)$' \
            -test.benchtime=1x \
            -test.count=3 \
            -test.benchmem | tee /report/legacy-benchmark.txt
        volumeMounts:
        - name: report
          mountPath: /report
        resources:
          requests:
            cpu: "2"
            memory: 2Gi
            ephemeral-storage: 2Gi
          limits:
            cpu: "4"
            memory: 6Gi
            ephemeral-storage: 8Gi
      containers:
      - name: integration
        image: registry.localhost:5000/beta9-state-volume-integration:state-volume-generated
        imagePullPolicy: Always
        securityContext:
          privileged: true
          allowPrivilegeEscalation: true
        env:
        - name: CONFIG_PATH
          value: /etc/beta9/.config.yaml
        - name: STATE_VOLUME_INTEGRATION_REPORT
          value: /report/state-volume-integration.json
        - name: STATE_VOLUME_INTEGRATION_ROOT
          value: /var/lib/beta9/state-volumes/integration
        - name: STATE_VOLUME_INTEGRATION_NODE
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: STATE_VOLUME_INTEGRATION_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: STATE_VOLUME_LEGACY_BENCHMARK
          value: /report/legacy-benchmark.txt
        - name: STATE_VOLUME_LEGACY_POD_HOSTNAME
          value: /report/legacy-pod-hostname
        - name: STATE_VOLUME_LEGACY_COMMIT
          value: 74483d8d7ddbad95fce813681c6026528c1cbe43
        - name: STATE_VOLUME_LEGACY_FIXTURE_PATCH_SHA256
          value: b9c6bd76bb19d197378969b5f781c9e29044cff201b553c26d1ad213e56ba3d8
        - name: STATE_VOLUME_LEGACY_IMAGE_DIGEST
          value: sha256:legacy-image-placeholder
        - name: STATE_VOLUME_BLOCK_IMAGE_DIGEST
          value: sha256:block-image-placeholder
        volumeMounts:
        - name: state-volumes
          mountPath: /var/lib/beta9/state-volumes
        - name: state-volume-locks
          mountPath: /var/lib/beta9/state-volume-locks
        - name: cache
          mountPath: /var/lib/beta9/cache
        - name: report
          mountPath: /report
        - name: config
          mountPath: /etc/beta9/.config.yaml
          subPath: .config.yaml
          readOnly: true
        resources:
          requests:
            cpu: "2"
            memory: 2Gi
          limits:
            cpu: "4"
            memory: 6Gi
      volumes:
      - name: state-volumes
        hostPath:
          path: /var/lib/beta9/state-volumes
          type: DirectoryOrCreate
      - name: state-volume-locks
        hostPath:
          path: /var/lib/beta9/state-volume-locks
          type: DirectoryOrCreate
      - name: cache
        hostPath:
          path: /var/lib/beta9/cache
          type: DirectoryOrCreate
      - name: report
        emptyDir: {}
      - name: config
        secret:
          secretName: beta9-config
