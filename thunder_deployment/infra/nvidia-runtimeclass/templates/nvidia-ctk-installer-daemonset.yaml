{{- if .Values.devicePlugin.installer.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-ctk-installer
  namespace: kube-system
  labels:
    app.kubernetes.io/name: nvidia-ctk-installer
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ include "nvidia-runtimeclass.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      name: nvidia-ctk-installer
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-ctk-installer
    spec:
      hostPID: true
      {{- with .Values.devicePlugin.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      priorityClassName: "system-node-critical"
      containers:
      - name: nvidia-ctk-installer
        image: {{ .Values.devicePlugin.installer.image }}
        command:
          - bash
          - -c
          - |
            nvidia-ctk runtime configure --runtime=containerd --config=/etc/containerd/config.toml --set-as-default
            nsenter --mount=/host/proc/1/ns/mnt -- systemctl restart containerd || true
            echo "NVIDIA runtime configured successfully"
            # Keep the container running
            sleep infinity
        {{- with .Values.devicePlugin.installer.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.devicePlugin.installer.volumeMounts }}
        volumeMounts:
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: containerd-config
          hostPath:
            path: /etc/containerd
            type: Directory
        - name: containerd-socket
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
{{- end }}
