# Default values for nvidia-runtimeclass.
# This is a YAML-formatted file.

# Enable/disable the RuntimeClass deployment
enabled: true

# RuntimeClass handler name
handler: nvidia

# Enable/disable device plugin
devicePlugin:
  enabled: true
  runtimeClassName: nvidia
  image: nvcr.io/nvidia/k8s-device-plugin:v0.18.2
  nodeSelector:
    beta9.node-role: gpu
  env:
    - name: FAIL_ON_INIT_ERROR
      value: "false"
    - name: PASS_DEVICE_SPECS
      value: "true"
    - name: NVIDIA_VISIBLE_DEVICES
      value: "all"
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: "compute,utility"
  securityContext:
    allowPrivilegeEscalation: true
    privileged: true
    capabilities:
      add:
        - SYS_ADMIN
  volumeMounts:
    - name: device-plugin
      mountPath: /var/lib/kubelet/device-plugins
    - name: dev
      mountPath: /dev
    - name: containerd-config
      mountPath: /etc/containerd
    - name: containerd-socket
      mountPath: /run/containerd/containerd.sock
  volumes:
    - name: device-plugin
      hostPath:
        path: /var/lib/kubelet/device-plugins
    - name: dev
      hostPath:
        path: /dev
    - name: containerd-config
      hostPath:
        path: /etc/containerd
        type: Directory
    - name: containerd-socket
      hostPath:
        path: /run/containerd/containerd.sock
        type: Socket
    - name: host-root
      hostPath:
        path: /
        type: Directory
  # NVIDIA Container Toolkit installer
  installer:
    enabled: true
    image: nvcr.io/nvidia/k8s/container-toolkit:v1.17.4-ubuntu20.04
    securityContext:
      privileged: true
    volumeMounts:
      - name: host-root
        mountPath: /host
      - name: containerd-config
        mountPath: /etc/containerd
      - name: containerd-socket
        mountPath: /run/containerd/containerd.sock

nameOverride: ""
fullnameOverride: ""
