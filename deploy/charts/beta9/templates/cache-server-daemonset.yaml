{{- if .Values.cacheServer.enabled -}}
{{- $configSecretName := required "cacheServer.configSecretName must name a dedicated cache-server Secret" .Values.cacheServer.configSecretName -}}
{{- if eq $configSecretName "beta9-config-helm" -}}
{{- fail "cacheServer.configSecretName cannot reference a gateway configuration Secret" -}}
{{- end -}}
{{- $gateway := .Values.controllers.gateway | default dict -}}
{{- if dig "enabled" true $gateway -}}
{{- $gatewayController := include "bjw-s.common.lib.controller.valuesToObject" (dict "rootContext" . "id" "gateway" "values" (deepCopy $gateway)) | fromYaml -}}
{{- $gatewayPod := include "bjw-s.common.lib.pod.spec" (dict "rootContext" . "controllerObject" $gatewayController) | fromYaml -}}
{{- range $gatewayPod.volumes -}}
{{- if eq $configSecretName (dig "secret" "secretName" "" .) -}}
{{- fail "cacheServer.configSecretName cannot reference a Secret mounted by the gateway" -}}
{{- end -}}
{{- range (dig "projected" "sources" (list) .) -}}
{{- if eq $configSecretName (dig "secret" "name" "" .) -}}
{{- fail "cacheServer.configSecretName cannot reference a Secret mounted by the gateway" -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- range concat (default (list) $gatewayPod.containers) (default (list) $gatewayPod.initContainers) -}}
{{- range .env -}}
{{- if eq $configSecretName (dig "valueFrom" "secretKeyRef" "name" "" .) -}}
{{- fail "cacheServer.configSecretName cannot reference a Secret used by the gateway environment" -}}
{{- end -}}
{{- end -}}
{{- range .envFrom -}}
{{- if eq $configSecretName (dig "secretRef" "name" "" .) -}}
{{- fail "cacheServer.configSecretName cannot reference a Secret used by the gateway environment" -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $serviceAccountName := printf "%s-cache-server" .Release.Name -}}
{{- $gatewayServiceAccountName := include "bjw-s.common.lib.pod.field.serviceAccountName" (dict "ctx" (dict "rootContext" .)) | trim -}}
{{- if eq $serviceAccountName $gatewayServiceAccountName -}}
{{- fail "cache-server and gateway must use different service accounts" -}}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $serviceAccountName }}
  {{- with (.Values.cacheServer.serviceAccount | default dict).annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $serviceAccountName }}
  labels:
    {{- include "bjw-s.common.lib.metadata.allLabels" . | nindent 4 }}
    app.kubernetes.io/component: cache-server
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: cache-server
  template:
    metadata:
      labels:
        {{- include "bjw-s.common.lib.metadata.allLabels" . | nindent 8 }}
        app.kubernetes.io/component: cache-server
    spec:
      serviceAccountName: {{ $serviceAccountName }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      {{- with .Values.cacheServer.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- if .Values.cacheServer.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with .Values.cacheServer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cacheServer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cacheServer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.defaultPodOptions.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: worker
        image: {{ .Values.cacheServer.image.repository | default .Values.images.worker.repository }}:{{ .Values.cacheServer.image.tag | default .Values.images.worker.tag | default .Chart.AppVersion }}
        imagePullPolicy: {{ .Values.cacheServer.image.pullPolicy | default .Values.images.worker.pullPolicy | default "IfNotPresent" }}
        command:
        - /usr/bin/tini
        - -g
        - --
        - /usr/local/bin/worker
        {{- with .Values.cacheServer.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        env:
        - name: CONFIG_PATH
          value: /etc/beta9/config.yaml
        - name: CACHE_SERVER_ONLY
          value: "true"
        - name: BEAM_WORKER_MINIMAL_CONFIG
          value: "true"
        - name: WORKER_POOL_NAME
          value: {{ .Values.cacheServer.poolName | quote }}
        - name: CACHE_LOCALITY
          value: {{ .Values.cacheServer.locality | quote }}
        - name: CACHE_NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: CACHE_HOST_NETWORK
          value: {{ .Values.cacheServer.hostNetwork | quote }}
        - name: CACHE_SERVER_PORT
          value: {{ .Values.cacheServer.serverPort | quote }}
        - name: WORKER_ID
          value: cache-server-$(CACHE_NODE_ID)
        ports:
        - name: cache
          containerPort: {{ .Values.cacheServer.serverPort }}
          {{- if .Values.cacheServer.hostNetwork }}
          hostPort: {{ .Values.cacheServer.serverPort }}
          {{- end }}
        volumeMounts:
        - name: config
          mountPath: /etc/beta9/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: cache
          mountPath: {{ .Values.cacheServer.mountPath }}
        - name: images
          mountPath: /images
        {{- with .Values.cacheServer.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      volumes:
      - name: config
        secret:
          secretName: {{ $configSecretName | quote }}
          items:
          - key: config.yaml
            path: config.yaml
      - name: cache
        hostPath:
          path: {{ .Values.cacheServer.hostPath }}
          type: DirectoryOrCreate
      - name: images
        {{- if .Values.config.worker.imagePVCName }}
        persistentVolumeClaim:
          claimName: {{ .Values.config.worker.imagePVCName }}
        {{- else }}
        hostPath:
          path: {{ .Values.cacheServer.imagesHostPath }}
          type: DirectoryOrCreate
        {{- end }}
{{- end -}}
