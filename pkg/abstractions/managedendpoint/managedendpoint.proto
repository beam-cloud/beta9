syntax = "proto3";

option go_package = "github.com/beam-cloud/beta9/proto";

package managedendpoint;

// Managed endpoints: platform-owned inference endpoints filled onto spare GPU
// capacity and served through the OpenRouter-compatible /v1 route.
//
// Two services share this file:
//   - EndpointHarnessService: called by the engine-side harness running inside
//     a replica container (runtime token auth). It registers, streams config
//     revisions, acks them, heartbeats capacity and publishes events.
//   - EndpointAdminService: called by operators, external tuning agents and
//     the frontend (cluster admin token auth). Read state, drive rollouts and
//     GitOps, and tune live config on a dedicated replica or the fleet.
//
// Free-form documents (specs, harness configs, capabilities) are
// carried as JSON strings so the contract can evolve engine-side without a
// proto change; the gateway validates them against pkg/types.

// ---------------------------------------------------------------------------
// Shared messages
// ---------------------------------------------------------------------------

message ReplicaCapacity {
  int64 in_flight = 1;
  int64 max_concurrency = 2;
  int64 running = 3;
  int64 waiting = 4;
  int64 kv_cache_free_milli = 5;
  int64 decode_tokens_per_sec = 6;
  int64 prompt_tokens_per_sec = 7;
  int64 ttft_ms = 8;
  int64 tpot_ms = 9;
  int64 prefix_cache_hit_milli = 10;
  // JSON-encoded KV transfer stats (connector specific), optional.
  string kv_transfer_json = 11;
}

message ConfigRevision {
  uint64 revision = 1;
  string endpoint_id = 2;
  string scope = 3;      // target | replica
  string scope_key = 4;  // target: "<role>:<gpu key>@v<version>"; replica: replica id
  string config_json = 5;
  string author = 6;
  string source = 7;     // git | live
  int64 created_at_unix_ms = 8;
}

message EndpointReplica {
  string id = 1;
  string endpoint_id = 2;
  uint32 version = 3;
  string role = 4;
  string gpu = 5;
  uint32 gpu_count = 6;
  string locality = 7;
  string pool_name = 8;
  string container_id = 9;
  string worker_id = 10;
  string address = 11;
  string status = 12;
  bool protected = 13;
  reserved 14;
  bool tuning = 15;
  bool harness_enabled = 16;
  uint64 config_revision = 17;
  ReplicaCapacity capacity = 18;
  string capabilities_json = 19;
  int64 started_at_unix_ms = 20;
  int64 ready_at_unix_ms = 21;
  int64 last_heartbeat_unix_ms = 22;
  string status_reason = 23;
}

message ManagedEndpoint {
  string id = 1;
  string spec_json = 2;
  string stub_id = 3;
  uint32 version = 4;
  string git_sha = 5;
  bool enabled = 6;
  string status = 7;
  int64 created_at_unix_ms = 8;
  int64 updated_at_unix_ms = 9;
  // Summary counters for listings.
  uint32 ready_replicas = 10;
  uint32 total_replicas = 11;
}

message ManagedService {
  string name = 1;
  string spec_json = 2;
  string stub_id = 3;
  uint32 version = 4;
  string git_sha = 5;
  bool enabled = 6;
  string status = 7;
  uint32 ready_replicas = 8;
  uint32 total_replicas = 9;
}

message Event {
  string name = 1;         // endpoint.* event name
  string payload_json = 2; // event schema payload
  int64 at_unix_ms = 3;
}

// ---------------------------------------------------------------------------
// EndpointHarnessService (in-container, runtime token)
//
// Every call carries the admin workspace's runtime token (BETA9_TOKEN) as the
// bearer credential and the replica's own secret (BEAM_REPLICA_SECRET) in the
// `x-beam-replica-secret` metadata key. The token admits managed endpoint
// containers as a class; the secret binds the call to one replica.
// ---------------------------------------------------------------------------

service EndpointHarnessService {
  // Register announces a replica's harness and returns its identity and the
  // current config revision. Idempotent per container.
  rpc Register(HarnessRegisterRequest) returns (HarnessRegisterResponse) {}
  // WatchConfig streams config revisions targeted at the replica (fleet or
  // replica scoped). The first message is the current revision.
  rpc WatchConfig(HarnessWatchConfigRequest) returns (stream ConfigRevision) {}
  // AckConfig reports whether a revision was applied.
  rpc AckConfig(HarnessAckConfigRequest) returns (HarnessAckConfigResponse) {}
  // Heartbeat reports liveness, capacity and engine metrics.
  rpc Heartbeat(HarnessHeartbeatRequest) returns (HarnessHeartbeatResponse) {}
  // PublishEvents forwards engine-side events into the platform event stream.
  rpc PublishEvents(HarnessPublishEventsRequest) returns (HarnessPublishEventsResponse) {}
}

message HarnessRegisterRequest {
  string container_id = 1;
  string engine = 2;
  string engine_version = 3;
  // JSON control catalog / capabilities advertised by the harness.
  string capabilities_json = 4;
  // JSON startup limits (max_num_seqs, max_model_len, ...).
  string limits_json = 5;
}

message HarnessRegisterResponse {
  bool ok = 1;
  string err_msg = 2;
  string replica_id = 3;
  string endpoint_id = 4;
  string role = 5;
  string gpu = 6;
  string locality = 7;
  uint32 heartbeat_interval_seconds = 8;
  ConfigRevision current = 9;
}

message HarnessWatchConfigRequest {
  string replica_id = 1;
  // Resume from this revision (exclusive); zero sends the current revision.
  uint64 after_revision = 2;
}

message HarnessAckConfigRequest {
  string replica_id = 1;
  uint64 revision = 2;
  bool applied = 3;
  string error = 4;
  // JSON of the effective config after apply.
  string effective_json = 5;
}

message HarnessAckConfigResponse {
  bool ok = 1;
  string err_msg = 2;
}

message HarnessHeartbeatRequest {
  string replica_id = 1;
  string status = 2;  // loading | ready | draining
  ReplicaCapacity capacity = 3;
  uint64 applied_revision = 4;
  // JSON engine metrics window summary (harness MetricsWindow).
  string metrics_json = 5;
  uint32 dropped_events = 6;
}

message HarnessHeartbeatResponse {
  bool ok = 1;
  string err_msg = 2;
  // Set when the control plane wants the replica to drain and exit.
  bool drain = 3;
  uint32 drain_seconds = 4;
  uint32 heartbeat_interval_seconds = 5;
}

message HarnessPublishEventsRequest {
  string replica_id = 1;
  repeated Event events = 2;
}

message HarnessPublishEventsResponse {
  bool ok = 1;
  string err_msg = 2;
  uint32 accepted = 3;
}

// ---------------------------------------------------------------------------
// EndpointAdminService (cluster admin token)
// ---------------------------------------------------------------------------

service EndpointAdminService {
  rpc ListEndpoints(ListEndpointsRequest) returns (ListEndpointsResponse) {}
  rpc GetEndpoint(GetEndpointRequest) returns (GetEndpointResponse) {}
  rpc ListReplicas(ListReplicasRequest) returns (ListReplicasResponse) {}
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse) {}
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse) {}
  rpc ListConfigRevisions(ListConfigRevisionsRequest) returns (ListConfigRevisionsResponse) {}
  rpc PromoteRollout(PromoteRolloutRequest) returns (RolloutActionResponse) {}
  rpc RollbackRollout(RollbackRolloutRequest) returns (RolloutActionResponse) {}
  rpc PinVersion(PinVersionRequest) returns (RolloutActionResponse) {}
  rpc GetGitOpsStatus(GetGitOpsStatusRequest) returns (GetGitOpsStatusResponse) {}
  rpc TriggerGitOpsSync(TriggerGitOpsSyncRequest) returns (TriggerGitOpsSyncResponse) {}
  rpc SetEndpointEnabled(SetEndpointEnabledRequest) returns (SetEndpointEnabledResponse) {}
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse) {}

  // Live tuning. An agent starts a dedicated tuning replica (no public
  // traffic; address it with X-Beam-Endpoint-Replica), pushes replica-scoped
  // configs with SetConfig and reads GetMetrics, then promotes the winner to
  // the fleet with a target-scoped SetConfig and stops the replica.
  rpc StartTuningReplica(StartTuningReplicaRequest) returns (ReplicaResponse) {}
  rpc StopReplica(StopReplicaRequest) returns (ReplicaResponse) {}
  rpc SetConfig(SetConfigRequest) returns (SetConfigResponse) {}
}

message ListEndpointsRequest {
  bool include_disabled = 1;
}

message ListEndpointsResponse {
  bool ok = 1;
  string err_msg = 2;
  repeated ManagedEndpoint endpoints = 3;
}

message GetEndpointRequest {
  string endpoint_id = 1;
}

message GetEndpointResponse {
  bool ok = 1;
  string err_msg = 2;
  ManagedEndpoint endpoint = 3;
  repeated EndpointReplica replicas = 4;
  RolloutState rollout = 5;
}

message ListReplicasRequest {
  string endpoint_id = 1;
  string status = 2;
  string gpu = 3;
  string role = 4;
}

message ListReplicasResponse {
  bool ok = 1;
  string err_msg = 2;
  repeated EndpointReplica replicas = 3;
}

message GetMetricsRequest {
  string endpoint_id = 1;
  string gpu = 2;
  string replica_id = 3;
  uint32 window_seconds = 4;
}

message EndpointMetrics {
  string endpoint_id = 1;
  string gpu = 2;
  uint32 window_seconds = 3;
  int64 requests = 4;
  int64 errors = 5;
  int64 prompt_tokens = 6;
  int64 completion_tokens = 7;
  int64 ttft_ms = 8;            // mean over the window
  int64 tpot_ms = 9;            // mean over the window
  int64 decode_tokens_per_sec = 10;
  int64 queue_wait_ms = 11;     // mean over the window
  int64 cost_micro_usd = 12;
  uint32 ready_replicas = 13;
  ReplicaCapacity aggregate_capacity = 14;
}

message GetMetricsResponse {
  bool ok = 1;
  string err_msg = 2;
  EndpointMetrics metrics = 3;
  repeated EndpointReplica replicas = 4;
}

message GetConfigRequest {
  string endpoint_id = 1;
  string scope = 2;     // target | replica
  // target: "<gpu key>", "<role>:<gpu key>" or "<role>:<gpu key>@v<version>";
  // without a version suffix the active version is used. replica: replica id.
  string scope_key = 3;
}

message GetConfigResponse {
  bool ok = 1;
  string err_msg = 2;
  ConfigRevision revision = 3;
}

message ListConfigRevisionsRequest {
  string endpoint_id = 1;
  string scope = 2;
  string scope_key = 3; // same forms as GetConfigRequest.scope_key
  uint32 limit = 4;
}

message ListConfigRevisionsResponse {
  bool ok = 1;
  string err_msg = 2;
  repeated ConfigRevision revisions = 3;
}

message EndpointVersion {
  string endpoint_id = 1;
  uint32 version = 2;
  string stub_id = 3;
  string git_sha = 4;
  string state = 5;
  int64 created_at_unix_ms = 6;
}

message RolloutState {
  string endpoint_id = 1;
  uint32 active_version = 2;
  uint32 canary_version = 3;
  uint32 pinned_version = 4;
  string phase = 5;
  int64 bake_started_at_unix_ms = 6;
  string last_decision = 7;
  int64 last_decision_at_unix_ms = 8;
  repeated EndpointVersion versions = 9;
}

message PromoteRolloutRequest {
  string endpoint_id = 1;
  uint32 version = 2;
}

message RollbackRolloutRequest {
  string endpoint_id = 1;
  uint32 version = 2;
}

message PinVersionRequest {
  string endpoint_id = 1;
  // Zero unpins.
  uint32 version = 2;
}

message RolloutActionResponse {
  bool ok = 1;
  string err_msg = 2;
  RolloutState rollout = 3;
}

message GitOpsEndpointState {
  string path = 1;
  string id = 2;
  string kind = 3;
  string applied_sha = 4;
  string status = 5;
  string error = 6;
  string stub_id = 7;
  uint32 version = 8;
  int64 updated_at_unix_ms = 9;
}

message GitOpsState {
  string repo_url = 1;
  string ref = 2;
  string last_sha = 3;
  string target_sha = 4;
  int64 last_run_at_unix_ms = 5;
  string last_error = 6;
  bool running = 7;
  repeated GitOpsEndpointState endpoints = 8;
}

message GetGitOpsStatusRequest {}

message GetGitOpsStatusResponse {
  bool ok = 1;
  string err_msg = 2;
  GitOpsState state = 3;
}

message TriggerGitOpsSyncRequest {
  // Optional explicit SHA; empty resolves the configured ref.
  string sha = 1;
}

message TriggerGitOpsSyncResponse {
  bool ok = 1;
  string err_msg = 2;
  bool started = 3;
}

message SetEndpointEnabledRequest {
  string endpoint_id = 1;
  bool enabled = 2;
}

message SetEndpointEnabledResponse {
  bool ok = 1;
  string err_msg = 2;
  ManagedEndpoint endpoint = 3;
}

message ListServicesRequest {}

message ListServicesResponse {
  bool ok = 1;
  string err_msg = 2;
  repeated ManagedService services = 3;
}

message StartTuningReplicaRequest {
  string endpoint_id = 1;
  string gpu = 2;   // GPU target key, e.g. "H100x2"
  string role = 3;  // defaults to serve
  // Wait up to this long for the replica to become ready (0 = return immediately).
  uint32 wait_seconds = 4;
}

message StopReplicaRequest {
  string replica_id = 1;
  // Grace for in-flight requests; zero stops immediately.
  uint32 drain_seconds = 2;
}

message ReplicaResponse {
  bool ok = 1;
  string err_msg = 2;
  EndpointReplica replica = 3;
}

message SetConfigRequest {
  string endpoint_id = 1;
  string scope = 2;      // target | replica
  string scope_key = 3;  // same forms as GetConfigRequest.scope_key
  string config_json = 4;
  string author = 5;
  // Replica scope: wait up to this long for the harness ack (0 = default).
  uint32 wait_seconds = 6;
}

message SetConfigResponse {
  bool ok = 1;
  string err_msg = 2;
  ConfigRevision revision = 3;
  // Replica scope only: the harness ack, when it arrived within the wait.
  bool acked = 4;
  bool applied = 5;
  string apply_error = 6;
}
