<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Share link unavailable · Beam</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #111113; color: #ededee; font: 16px/1.6 system-ui, sans-serif; }
    main { width: 100%; max-width: 480px; }
    .brand { color: #4ccacc; font-size: 14px; font-weight: 650; letter-spacing: .02em; }
    h1 { margin: 20px 0 12px; font-size: clamp(26px, 5vw, 34px); line-height: 1.2; letter-spacing: -.025em; font-weight: 600; }
    p { margin: 0; color: #b5b5bd; }
    a { display: inline-block; margin-top: 28px; padding: 10px 16px; border: 1px solid #3a3a40; border-radius: 8px; color: #ededee; text-decoration: none; font-size: 14px; font-weight: 550; }
    a:hover, a:focus-visible { background: #242428; border-color: #4ccacc; }
    @media (prefers-color-scheme: light) {
      body { background: #fff; color: #202023; }
      p { color: #60606a; }
      .brand { color: #147c7c; }
      a { color: #202023; border-color: #d9d9df; }
      a:hover, a:focus-visible { background: #f5f5f7; border-color: #147c7c; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">Beam</div>
    <h1>This share link is no longer valid.</h1>
    <p>It may have expired or been revoked. Ask the sender for a new link.</p>
    {{if .OwnerURL}}<a href="{{.OwnerURL}}">Open with my Beam account</a>{{end}}
  </main>
</body>
</html>
