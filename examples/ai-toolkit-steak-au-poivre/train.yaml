---
job: extension
config:
  name: steak_au_poivre_flux2_klein_4b_lora
  process:
    - type: diffusion_trainer
      training_folder: /cache/runs
      device: cuda
      trigger_word: b9poivre
      performance_log_every: 25
      network:
        type: lora
        linear: 16
        linear_alpha: 16
      save:
        dtype: bf16
        save_every: 300
        max_step_saves_to_keep: 2
        save_format: safetensors
        push_to_hub: false
      datasets:
        - folder_path: /cache/dataset
          caption_ext: txt
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [768, 1024]
          num_repeats: 1
      train:
        batch_size: 1
        bypass_guidance_embedding: false
        steps: 600
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: flowmatch
        optimizer: adamw8bit
        timestep_type: weighted
        content_or_style: balanced
        optimizer_params:
          weight_decay: 0.0001
        unload_text_encoder: false
        cache_text_embeddings: false
        lr: 0.0001
        ema_config:
          use_ema: false
          ema_decay: 0.99
        skip_first_sample: true
        force_first_sample: false
        disable_sampling: false
        dtype: bf16
        diff_output_preservation: false
        switch_boundary_every: 1
        loss_type: mse
      logging:
        log_every: 10
        use_ui_logger: false
      model:
        name_or_path: black-forest-labs/FLUX.2-klein-base-4B
        arch: flux2_klein_4b
        quantize: true
        qtype: qfloat8
        quantize_te: true
        qtype_te: qfloat8
        low_vram: false
        layer_offloading: false
        model_kwargs:
          match_target_res: false
      sample:
        sampler: flowmatch
        sample_every: 600
        sample_start_step: 600
        width: 1024
        height: 1024
        samples:
          - prompt: >-
              b9poivre, an elegant steak au poivre with cognac peppercorn sauce
              and pommes frites, candlelit Parisian bistro, editorial food photography
          - prompt: >-
              b9poivre, close-up sliced medium-rare filet mignon with glossy green
              peppercorn cream sauce, white porcelain plate, natural window light
          - prompt: >-
              b9poivre, modern fine-dining steak au poivre with pommes dauphinoise
              and haricots verts, dark moody restaurant photography
        neg: ""
        seed: 42
        walk_seed: true
        guidance_scale: 4
        sample_steps: 40
        format: png
meta:
  name: "[name]"
  version: "1.0"
