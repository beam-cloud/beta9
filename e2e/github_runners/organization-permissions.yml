# Copy to .github/workflows/organization-permissions.yml in a repository
# selected by Beam Runners Staging. Configure staging's labelPrefix as
# stage-org-permissions- so a production App covering all repos ignores it.
name: Organization runner permissions smoke

on:
  push:
    branches: [codex/org-runner-permissions-smoke]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      matrix:
        replica: [1, 2]
    runs-on: stage-org-permissions-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      # Checkout uses the job's GITHUB_TOKEN, not the runner App's grant.
      - uses: actions/checkout@v4
      - name: Verify the ephemeral runner
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RUNNER_NAME: ${{ runner.name }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(id -un)" = runner
          case "$RUNNER_NAME" in ghr-*) ;; *) exit 1 ;; esac
          printf 'Runner %s executed commit %s\n' "$RUNNER_NAME" "$EXPECTED_SHA"
          # Leave time to observe online/busy state through the org API.
          sleep 20
