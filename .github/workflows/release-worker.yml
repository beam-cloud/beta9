name: Build and release Worker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      app_version:
        description: Semantic version of release
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  microvm:
    if: startsWith(github.ref, 'refs/tags/worker-') || inputs.app_version != ''
    uses: ./.github/workflows/microvm-image.yml
    secrets: inherit

  build_and_release_worker:
    if: startsWith(github.ref, 'refs/tags/worker-') || inputs.app_version != ''
    needs: microvm
    environment: Release
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_GITHUB }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
        with:
          registry-type: public
          mask-password: "true"

      - name: Set version
        id: set-version
        env:
          RELEASE_VERSION: ${{ inputs.app_version }}
        run: |
          echo "TAG_NAME=${RELEASE_VERSION:-${GITHUB_REF_NAME#worker-}}" >> "$GITHUB_OUTPUT"

      - name: Build and push container image to Amazon ECR
        uses: docker/build-push-action@v5
        with:
          file: ./docker/Dockerfile.worker
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/n4e0e1y0/beta9-worker:${{ steps.set-version.outputs.TAG_NAME }}-${{ matrix.arch }}
          target: final
          platforms: ${{ matrix.platform }}
          build-args: |
            MICROVM_IMAGE=${{ needs.microvm.outputs.image }}

  publish_worker_manifest:
    if: startsWith(github.ref, 'refs/tags/worker-') || inputs.app_version != ''
    needs: build_and_release_worker
    environment: Release
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_GITHUB }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
        with:
          registry-type: public
          mask-password: "true"

      - name: Set version
        id: set-version
        env:
          RELEASE_VERSION: ${{ inputs.app_version }}
        run: |
          echo "TAG_NAME=${RELEASE_VERSION:-${GITHUB_REF_NAME#worker-}}" >> "$GITHUB_OUTPUT"

      - name: Publish multi-platform image manifests
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/n4e0e1y0/beta9-worker
          TAG_NAME: ${{ steps.set-version.outputs.TAG_NAME }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG_NAME}" \
            "${IMAGE}:${TAG_NAME}-amd64" \
            "${IMAGE}:${TAG_NAME}-arm64"

          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${TAG_NAME}-amd64" \
            "${IMAGE}:${TAG_NAME}-arm64"
